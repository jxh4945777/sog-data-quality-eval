# model: "gpt-4o-mini"

# 方式 3: 本地部署 (vLLM / Ollama / llama.cpp)
# api_base: "http://localhost:8000/v1"   # vLLM
# api_base: "http://localhost:11434/v1"  # Ollama
# api_key: "not-needed"
# model: "qwen2.5-72b-instruct"

# 评估参数
temperature: 0.1
max_retries: 3
retry_delay: 2
