# SoG 数据质量评估 — LLM 配置
# 复制为 config.yaml 并填写配置

# 方式 1: OpenAI 兼容 API (云端)
api_base: "https://api.openai.com/v1"
api_key: "sk-your-key-here"
model: "gpt-4o-mini"

# 方式 2: 自定义 API (如中转站)
# api_base: "https://your-proxy.com/v1"
